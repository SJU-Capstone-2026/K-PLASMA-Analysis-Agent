openapi: 3.1.0
info:
  title: K-PLASMA shared Agent request API
  version: 3.1.0
  description: |
    Python LangGraph worker; Spring owns durable request acceptance and final turns.
    Existing fallback is preserved as source but is not invoked by v1.
    Bounded reverse queries filter first, including wording such as near/가깝게.
    A soft target_range requires explicit permission to include outside-range Runs.
    Reverse snapshots add candidateEvaluations keyed by exact runId/runVersionId,
    with saved evaluations, referenceValue and integer matchPercent. Existing common
    and objective candidates also include these presentation scores. The frontend
    reuses prototype presentation without re-filtering, reordering or recalculating.
    Older completed snapshots remain immutable; missing saved scores are unavailable.
    Reverse goals order common matches and no longer generate independent global
    goal tabs. New reverse snapshots keep goalResults as an empty compatibility
    array; objectiveResults retain independent condition matches.
    Search presentation stays compatible. Search/general answers retain schemaVersion 2. Extended comparisons use schemaVersion 3.
    One native tool call selects forward_lookup, reverse_search, compare_runs or generate_answer.
    Old completed schema-1 answers remain readable; old pending jobs fail the build fingerprint fence.
    All worker endpoints require X-Agent-Token configured by AGENT_WORKER_TOKEN.
    The worker has no database credentials. A synchronous HTTP checkpoint adapter
    stores typed serializer bytes as JSON/base64 in PostgreSQL under the same
    transaction/row lock as generation, request revision, status and lease checks.
    This deliberately replaces the draft plan's worker SQL role/SECURITY DEFINER
    function. All put/put_writes calls must await this endpoint. Do not use pickle.
    Transient checkpoint/manifest erasure is atomic with completion/failure/reset
    instead of asynchronous cleanup; a transaction failure rolls back the state
    transition so the same operation is retryable without orphaned drafts.
    All statuses are workflow states, separate from domain result statuses.
    Lock order is intake (Run deletion only), workspace, request. Checkpoint writes
    and claim lock request only; heartbeat follows workspace then request when
    resolving deferred dependency invalidation. Before operation classification,
    a reference change or referenced Run deletion marks the captured context invalid.
    Classification cancels dependent work under the same lock, while independent
    operations such as concept explanation may continue. Workspace reset cancels;
    new conversations and room navigation preserve work in its original room.
    No model call holds a DB transaction.
    Public events are additive for both graph versions. SSE replays committed rows
    using Last-Event-ID or after, while format=json provides the identical ordered
    event page. Reconnection never submits or executes work. A terminal subscription
    with no unread events returns 204. The duration is accumulated server-observed
    RUNNING time, excluding queue and user-input waits; abandoned intervals stop at
    their previous lease. Historical requests without timing evidence omit summaries.
    Graph v3 is an independent runtime using these shared durable server endpoints.
    Every v3 request supplies explicit v3Options booleans; the server stores their
    canonical SHA256 digest and returns the same switches throughout resume/recovery.
    V3 plan and step writes reject disabled decision-record actions. Numeric checks
    and plan Decisions remain enabled independently of these feature switches.
    Graph-v3 answer schema 1 is agent-graph-v3.answer.schema.json. The older file
    agent-answer-v3.schemas.yaml describes answer schema 3 of graph v1, not graph v3.
paths:
  /api/run-versions/outputs:
    post:
      summary: Batch-load exact-version original outputs for charts
      description: Maximum 50 unique Run references and 7 output IDs. Every output reads the exact-version DB snapshot. The public response contains the complete source points or grid. Worker requests return compact metadata and features. Missing snapshots report OUTPUT_NOT_INDEXED or IAD_NOT_INDEXED. Bias-off outputs without a source distribution report BIAS_OFF.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutputQuery' }
      responses:
        '200':
          description: Native axes and units, full-source extrema and original display points. IAD display contains all validated points. Display payload is browser-only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutputResponse' }
        '400': { description: Invalid batch bounds, duplicate refs or unknown output ID }
  /internal/agent/requests/{id}/comparison-outputs:
    post:
      summary: Load compact full-source features for the fixed comparison selection
      security: [{ WorkerToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      description: claimGeneration and requestRevision fence before/after I/O; runRefs must be a subset of captured comparisonReference. Worker batches 25 (API max 50). No raw display arrays are returned. No new batch resume protocol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/OutputQuery' }
                - type: object
                  required: [claimGeneration, requestRevision]
                  properties:
                    claimGeneration: { type: integer }
                    requestRevision: { type: integer }
      responses:
        '200':
          description: Compact outputs array with metadata, typed scalar features and display=null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutputResponse' }
        '400': { description: Unknown output or selection outside the fixed inventory }
        '409': { description: Stale worker claim }
  /api/agent/requests:
    post:
      operationId: submitAgentRequest
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Submission' }
      responses:
        '200': { $ref: '#/components/responses/Request' }
        '409': { description: STALE_CONTEXT, REQUEST_IN_PROGRESS or IDEMPOTENCY_CONFLICT }
  /api/agent/requests/{id}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      operationId: getAgentRequest
      responses:
        '200': { $ref: '#/components/responses/Request' }
        '404': { description: Request not found }
  /api/agent/requests/{id}/events:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      operationId: replayAgentPublicEvents
      description: >-
        Replay committed events after a cursor. SSE uses default message events whose data is the
        entire envelope and id is seq. Last-Event-ID takes precedence over after. No database
        connection or request lock is held while awaiting or sending events. Each JSON page and
        status snapshot describes one locked request prefix; apply its cursor only after the
        returned events. Follow hasMore using the last returned seq. NEEDS_INPUT closes the
        current subscription; resume opens a new one at the same request's cursor.
      parameters:
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: Last-Event-ID, in: header, schema: { type: integer, minimum: 0 } }
        - { name: format, in: query, schema: { const: json }, description: Omit for SSE. }
      responses:
        '200':
          description: Durable replay; SSE closes after its final committed event.
          content:
            text/event-stream:
              schema: { type: string, description: 'id: seq followed by data: JSON PublicEvent and a blank line.' }
            application/json:
              schema: { $ref: '#/components/schemas/PublicEventPage' }
        '204': { description: Terminal or input-waiting request already received through lastEventSeq; stops EventSource reconnect. }
        '400': { description: Invalid or out-of-range event cursor. }
        '404': { description: Request was removed or reset; event and draft content is unavailable. }
  /api/agent/requests/{id}/results:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      operationId: getAgentPublicResults
      description: >-
        Read the immutable saved executions referenced by one results.ready seq. New bindings
        require current graph-valid verified/empty/partial tool executions and exact frozen Run
        references. Older bindings keep their original contents after a replan. Only tool-card
        fields are projected; no plan, inputs, model output or original graph arrays are returned.
      parameters:
        - { name: resultRevision, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The requested public result version.
          content:
            application/json:
              schema:
                type: object
                required: [resultRevision, results]
                properties:
                  resultRevision: { type: integer }
                  results:
                    type: array
                    maxItems: 16
                    items:
                      type: object
                      additionalProperties: false
                      required: [stepId, executionId, runRefs, toolResult]
                      properties:
                        stepId: { type: string }
                        executionId: { type: string, format: uuid }
                        runRefs: { type: array, items: { $ref: '#/components/schemas/RunRef' } }
                        toolResult: { type: object, description: Existing forward_lookup, reverse_search or compare_runs public tool-card contract. }
        '404': { description: No such results.ready version, or request content was removed or reset. }
  /internal/agent/requests/{id}/events:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: appendAgentPublicEvent
      security: [{ WorkerToken: [] }]
      description: >-
        Uses the current worker generation, request revision, live lease and workspace/conversation
        fences. eventKey is request-scoped and max 200 characters; system: is reserved. Same type
        and normalized payload replays the original envelope; changed content conflicts.
        answer.start allocates the next answerRevision when omitted and returns it in payload.
        answer.delta requires the current stream and contiguous global chunkIndex (first 0 or 1).
        Each text chunk is 1..8192 characters and total preview text is bounded to 1000000 characters.
        results.ready accepts only current tool-card execution IDs, and resultRevision is this event's seq.
        request.state is emitted only by backend lifecycle transactions, never by the worker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [claimGeneration, requestRevision, eventKey, type, payload]
              properties:
                claimGeneration: { type: integer }
                requestRevision: { type: integer }
                eventKey: { type: string, minLength: 1, maxLength: 200 }
                type: { enum: [activity, answer.start, answer.delta, answer.reset, results.ready] }
                payload: { $ref: '#/components/schemas/WorkerPublicPayload' }
      responses:
        '200':
          description: Durable envelope, including allocated answerRevision/resultRevision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEvent' }
        '400': { description: Unknown public fields, activity code, invalid size or payload. }
        '401': { description: Worker token required. }
        '409': { description: Stale fence, invalidated execution/stream, noncontiguous chunk or idempotency conflict. }
  /api/agent/requests/{id}/run-options:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      operationId: getFixedRunSelectionPage
      parameters:
        - { $ref: '#/components/parameters/PendingInputId' }
        - { name: format, in: query, required: false, schema: { type: integer, enum: [2] } }
        - { name: query, in: query, schema: { type: string, maxLength: 256 } }
        - { name: sort, in: query, schema: { enum: [ascending, descending], default: ascending } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 4000 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      description: Latest catalogue pages and exact selected versions; DB literal substring search and natural numeric ordering. Cursor is bound to request revision, pending input, snapshot, query and sort. Selected or explicitly attached deleted versions remain visible and disabled in selected/attached state; unselected deleted Runs disappear from the live catalogue. No workspace history or full Run payload is loaded. Graph v1 requires format=2. Graph v2 omits format and reads its frozen filtered candidates, including search measurements and original search order; it does not fall back to the live catalogue.
      responses:
        '200':
          description: At most pageSize options, with a keyset cursor.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/RunSelectionPage' }
                  - { $ref: '#/components/schemas/LegacyV2RunOptions' }
        '400': { description: Invalid query, cursor or page size. }
        '409': { description: Wrong request epoch or pending input, or CLIENT_REFRESH_REQUIRED. }
  /api/agent/requests/{id}/run-options/count:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      operationId: countFixedRunSelectionMatches
      parameters:
        - { $ref: '#/components/parameters/PendingInputId' }
        - { name: query, in: query, schema: { type: string, maxLength: 256 } }
      responses:
        '200':
          description: Selection session metadata plus matchingCount (including disabled options); independent of the page request.
          content:
            application/json:
              schema:
                type: object
                required: [format, requestId, requestRevision, pendingInputId, snapshotId, selectionRevision, totalCount, baselineKey, matchingCount]
                properties:
                  format: { const: 2 }
                  requestId: { type: string, format: uuid }
                  requestRevision: { type: integer }
                  pendingInputId: { type: string }
                  snapshotId: { type: string, format: uuid }
                  selectionRevision: { type: integer }
                  totalCount: { type: integer }
                  baselineKey: { type: [string, 'null'] }
                  matchingCount: { type: integer, minimum: 0 }
        '409': { description: Stale pending input. }
  /api/agent/requests/{id}/run-selection:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      operationId: getPersistedRunSelection
      parameters:
        - { $ref: '#/components/parameters/PendingInputId' }
        - { name: cursor, in: query, schema: { type: string, maxLength: 4000 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: Selected exact versions only, paged in stable ordinal order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunSelectionState' }
        '409': { description: Stale pending input. }
    post:
      operationId: changePersistedRunSelection
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      description: Serialized revision-fenced mutation. add/remove accept 1..100 unique aliases. search/all capture currently matching exact versions and union them with existing selection. Catalogue reads never persist unselected candidates. clear removes all selections. baseline must be selected and available. Retries with the same key/body do not reapply a mutation and return current selection state. Selection is deleted atomically on resume/cancel/reset/final failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pendingInputId, expectedRequestRevision, expectedSelectionRevision, operation]
              properties:
                pendingInputId: { type: string, maxLength: 200 }
                expectedRequestRevision: { type: integer }
                expectedSelectionRevision: { type: integer }
                operation: { enum: [add, remove, search, all, clear, baseline] }
                keys: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, maxLength: 80 } }
                query: { type: string, maxLength: 256 }
                baselineKey: { type: [string, 'null'], maxLength: 80 }
      responses:
        '200':
          description: Current selection metadata and first 30 selected options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunSelectionState' }
        '400': { description: Invalid aliases, baseline or unavailable Run. }
        '409': { description: STALE_REQUEST or IDEMPOTENCY_CONFLICT. }
  /api/agent/requests/{id}/resume:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: resumeAgentRequest
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRequestRevision, pendingInputId, input]
              properties:
                expectedRequestRevision: { type: integer, minimum: 0 }
                pendingInputId: { type: string }
                input:
                  type: object
                  description: Text replies use type=text and text. Run selection uses type=run_selection, snapshotId and selectionRevision; the server resolves at least two persisted exact references. Legacy runKeys/baselineKey replies remain accepted with their original order. Comparison options use type=comparison_options and baselineKey and/or trendAxis. A decision_threshold pending (RECORD_REUSE) accepts type=decision_threshold with an integer threshold, or a text reply such as "3건"; invalid values end in a notice without excluding Runs. Browser replies never supply comparisonReference; server enriches trusted events.
                  additionalProperties: true
      responses:
        '200': { $ref: '#/components/responses/Request' }
        '409': { description: STALE_REQUEST, INPUT_LIMIT or IDEMPOTENCY_CONFLICT }
  /api/agent/requests/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: cancelAgentRequest
      responses:
        '200': { $ref: '#/components/responses/Request' }
  /internal/agent/claim:
    post:
      operationId: claimAgentRequest
      security: [{ workerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId]
              properties:
                workerId: { type: string, maxLength: 200 }
                leaseSeconds: { type: integer, minimum: 5, maximum: 300, default: 60 }
                supportedGraphVersions: { type: array, minItems: 1, uniqueItems: true, items: { enum: [v1, v2, v3] }, description: Omission retains legacy v1-only claiming. }
      responses:
        '200':
          description: >-
            No work returns request null. Expired RUNNING requests can be reclaimed.
            Each request revision reserves at most three claims durably. After the third
            lease expires, the next claim atomically marks it FAILED with CLAIM_ATTEMPT_LIMIT,
            fences old workers, and purges transient checkpoints before continuing the queue.
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request: { oneOf: [{ $ref: '#/components/schemas/RequestView' }, { type: 'null' }] }
                  claimGeneration: { type: integer }
                  requestRevision: { type: integer }
                  context: { type: object }
                  inputEvents: { type: array, items: { type: object } }
  /internal/agent/requests/{id}/heartbeat:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: heartbeatAgentRequest
      security: [{ workerToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/Mutation' }
      responses:
        '200': { $ref: '#/components/responses/Request' }
        '409': { $ref: '#/components/responses/StaleClaim' }
  /internal/agent/requests/{id}/context:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      operationId: getAgentManifest
      security: [{ workerToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Generation' }, { $ref: '#/components/parameters/Revision' }]
      responses:
        '200': { $ref: '#/components/responses/Manifest' }
        '409': { $ref: '#/components/responses/StaleClaim' }
    post:
      operationId: pinAgentManifestWithExactVersions
      security: [{ workerToken: [] }]
      description: |
        requiredRunRefs adds exact historical versions. First successfully committed call fixes ordered
        latest scalar summaries and available acceptance refs for ordinary lookups.
        forwardQuery contains pressure (mTorr), sourcePower (W), and biasPower (W)
        already normalized by the worker. For forward_lookup only, the server derives
        the integer condition Run ID and looks up its current version using the existing
        primary key. A usable exact match pins only that Run in runs/catalogRunRefs;
        unrelated catalog exclusions are not enumerated in this scoped exact result.
        The actual stored conditions and status are checked before accepting the match.
        Missing, non-integer, noncanonical or unavailable matches use the legacy catalog
        path, preserving nearest ranking and exclusions. Previously pinned legacy manifests
        also keep that path. Forward referencesOnly prepares just required/selected/active
        historical references, without pinning the entire catalog; the exact result is
        pinned when forwardQuery is materialized. Replay cannot replace its version or query.
        forwardQuery cannot be combined with reverseQuery or referencesOnly.
        A reverseQuery selects current versions in one SQL snapshot using typed scalar
        predicates and ordered goals. Only common matches and independent output-condition
        matches are returned, with selectedRunRefs pinning that exact pool. No global
        catalogRunRefs or nearest-candidate pool is read or persisted. Zero matches is
        a materialized empty result. referencesOnly pins only explicit requiredRunRefs
        with an empty runs array; it resolves context-derived bounds before reverseQuery.
        Deleted versions mentioned in previous answers are optional interpretation
        context and do not block an unrelated lookup; explicit requiredRunRefs are
        checked. A selected unavailable role must lead to a clarification.
        Later calls can append exact versions to referencedRuns but never refresh
        a materialized query or replace existing scalar values. A scoped query
        is materialized once; replay uses the identical stored query and selected pool.
        Changing a materialized reverseQuery returns MANIFEST_QUERY_CONFLICT.
        Python still verifies numeric predicates and resolves full Decimal/tie order.
        generate_answer skips this API. compare_runs requires referencesOnly and an ordered
        subset of the saved explicit comparisonReference. It materializes only those exact versions
        in referencedRuns; runs/catalogRunRefs stay empty. Identity/scalar reads are bulk queries.
      requestBody: { $ref: '#/components/requestBodies/Mutation' }
      responses:
        '200': { $ref: '#/components/responses/Manifest' }
        '409': { $ref: '#/components/responses/StaleClaim' }
  /internal/agent/requests/{id}/checkpoint:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      operationId: getAgentCheckpoint
      security: [{ workerToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Generation' }, { $ref: '#/components/parameters/Revision' }]
      responses:
        '200':
          description: Current opaque checkpoint envelope; payload null when absent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload: { type: [object, 'null'] }
        '409': { $ref: '#/components/responses/StaleClaim' }
    post:
      operationId: putAgentCheckpoint
      security: [{ workerToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/Mutation' }
      responses:
        '200': { description: Saved under the same claim fence transaction. }
        '409': { $ref: '#/components/responses/StaleClaim' }
  /internal/agent/requests/{id}/attempt:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: reserveModelAttempt
      security: [{ workerToken: [] }]
      description: |
        Call before each external model call. interpret and interpret_repair share
        a maximum of 4 reservations per request revision; explain/explain_repair
        share another 4. A worker crash never refunds a reserved attempt.
      requestBody: { $ref: '#/components/requestBodies/Mutation' }
      responses:
        '200': { description: Object with attempt and limit. }
        '409': { description: STALE_CLAIM or MODEL_ATTEMPT_LIMIT }
  /internal/agent/requests/{id}/decision-records:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: readDecisionRecordsForReuse
      security: [{ workerToken: [] }]
      description: |
        Only for operationKind decision_records or reverse_search, after context()
        has created the request manifest. The first read pins the records, in save
        order, as manifest.decisionRecords; retries and resumes return the same
        array. Records carry only reviewId, id, version, targetRunId, targetRunRef,
        decision, comment, overallComment, question, queryText, createdAt, isDemo,
        candidates[runId, runVersionId, decision, note, conditions] and
        runSnapshots[runId, runVersionId, conditions]. Authors, objectives and
        metrics are omitted. Notes are user text: workers classify them locally and
        must not send them to a model or an external trace.
      requestBody: { $ref: '#/components/requestBodies/Mutation' }
      responses:
        '200': { description: Object with records. }
        '400': { description: Unsupported operationKind or missing request manifest }
        '409': { $ref: '#/components/responses/StaleClaim' }
  /internal/agent/requests/{id}/needs-input:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: suspendAgentRequest
      security: [{ workerToken: [] }]
      description: Save interrupt checkpoint before this call. Lease is released. Resume preserves checkpoint. run_selection creates a small selection session and retains only explicit attached references. Lists are read directly from current catalogue rows with keyset pagination; only selected exact versions are persisted. snapshotId identifies selection state, not a full catalogue snapshot.
      requestBody: { $ref: '#/components/requestBodies/Mutation' }
      responses:
        '200': { $ref: '#/components/responses/Request' }
        '409': { $ref: '#/components/responses/StaleClaim' }
  /internal/agent/requests/{id}/finalize:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: finalizeAgentRequest
      security: [{ workerToken: [] }]
      description: |
        Pass answer as the existing AgentResponse contract. Server builds a final
        turn with id=requestId and original question/time. One transaction appends
        the turn, advances workspace, completes request and removes transient data.
        Exact answer replay returns completed state; altered payload conflicts.
      requestBody: { $ref: '#/components/requestBodies/Mutation' }
      responses:
        '200': { $ref: '#/components/responses/Request' }
        '409': { description: STALE_CLAIM, STALE_CONTEXT or IDEMPOTENCY_CONFLICT }
  /internal/agent/requests/{id}/fail:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: failAgentRequest
      security: [{ workerToken: [] }]
      description: |
        error includes a safe code/message, never raw provider response or secrets.
        Native compare_runs (schema 2) and legacy explain_change may retain a validated comparison partialResult with
        explanationComplete=false and both usedRunRefs. Raw drafts stay private.
      requestBody: { $ref: '#/components/requestBodies/Mutation' }
      responses:
        '200': { $ref: '#/components/responses/Request' }
        '409': { $ref: '#/components/responses/StaleClaim' }
components:
  securitySchemes:
    workerToken: { type: apiKey, in: header, name: X-Agent-Token }
  parameters:
    PendingInputId:
      name: pendingInputId
      in: query
      required: true
      schema: { type: string, maxLength: 200 }
    RequestId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
    Generation: { name: claimGeneration, in: query, required: true, schema: { type: integer } }
    Revision: { name: requestRevision, in: query, required: true, schema: { type: integer } }
  requestBodies:
    Mutation:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Mutation' }
  responses:
    Request:
      description: Durable request state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RequestView' }
    StaleClaim:
      description: STALE_CLAIM; discard local work. No state or checkpoint was written.
    Manifest:
      description: Ordered scalar summaries only, never raw source files or graph arrays.
      content:
        application/json:
          schema:
            type: object
            required: [runs, referencedRuns, context, createdAt]
            properties:
              runs: { type: array, items: { type: object, description: RunSummary plus nullable sourceFileCount } }
              referencedRuns: { type: array, items: { type: object } }
              context: { type: object }
              createdAt: { type: string, format: date-time }
              catalogRunRefs: { type: array, items: { $ref: '#/components/schemas/RunRef' }, description: Legacy inventory or exact forward selection; absent in new reverse queries. }
              selectedRunRefs: { type: array, items: { $ref: '#/components/schemas/RunRef' }, description: Exact materialized reverse-query pool, including an empty array for no matches. }
              reverseQuery: { $ref: '#/components/schemas/ReverseQuery' }
  schemas:
    PublicActivity:
      type: object
      additionalProperties: false
      required: [activityId, code, phase]
      properties:
        activityId: { type: string, maxLength: 200 }
        code: { enum: [QUEUED, QUESTION_CHECK, PLAN, PLAN_VALIDATE, PLAN_REVIEW, FORWARD_LOOKUP, REVERSE_SEARCH, SEARCH_COMPLETE, SEARCH_EMPTY, COMPARE_RUNS, COMPARE_OUTPUTS, COMPARE_IEAD, DERIVE, RESULT_VALIDATE, REUSE_RESULT, NEEDS_RUNS, NEEDS_BASELINE, NEEDS_CONDITIONS, RESUMED, REPLAN, GENERAL_ANSWER, INTERPRET, REVIEW, REWRITE, COMMIT, RECOVERING, DECISION_RECORDS] }
        phase: { enum: [started, completed, reused] }
        stepId: { type: string, maxLength: 200 }
        runCount: { type: integer, minimum: 0, maximum: 1000000 }
        metricIds: { type: array, maxItems: 24, items: { type: string, maxLength: 80 } }
    WorkerPublicPayload:
      oneOf:
        - { $ref: '#/components/schemas/PublicActivity' }
        - type: object
          additionalProperties: false
          required: [streamId, mode]
          properties:
            streamId: { type: string, maxLength: 200 }
            answerRevision: { type: integer, minimum: 1, maximum: 1000 }
            mode: { enum: [general, interpretation] }
            rewrite: { type: boolean, default: false }
        - type: object
          additionalProperties: false
          required: [streamId, answerRevision, blockId, text, chunkIndex]
          properties:
            streamId: { type: string, maxLength: 200 }
            answerRevision: { type: integer, minimum: 1 }
            blockId: { type: string, maxLength: 200 }
            text: { type: string, minLength: 1, maxLength: 8192 }
            chunkIndex: { type: integer, minimum: 0, maximum: 100000 }
        - type: object
          additionalProperties: false
          required: [streamId, answerRevision]
          properties:
            streamId: { type: string, maxLength: 200 }
            answerRevision: { type: integer, minimum: 1 }
            reason: { type: string, pattern: '^[A-Z_]{1,80}$', default: RESET }
        - type: object
          additionalProperties: false
          required: [executionIds]
          properties:
            executionIds: { type: array, maxItems: 16, uniqueItems: true, items: { type: string, format: uuid } }
    PublicEvent:
      type: object
      additionalProperties: false
      required: [schemaVersion, requestId, workspaceEpoch, conversationEpoch, requestRevision, seq, occurredAt, type, payload]
      properties:
        schemaVersion: { const: 1 }
        requestId: { type: string, format: uuid }
        workspaceEpoch: { type: integer }
        conversationEpoch: { type: integer }
        requestRevision: { type: integer }
        seq: { type: integer, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        type: { enum: [activity, results.ready, answer.start, answer.delta, answer.reset, request.state] }
        payload:
          anyOf:
            - { $ref: '#/components/schemas/WorkerPublicPayload' }
            - type: object
              additionalProperties: false
              required: [executionIds, resultRevision]
              properties:
                executionIds: { type: array, maxItems: 16, uniqueItems: true, items: { type: string, format: uuid } }
                resultRevision: { type: integer, minimum: 1 }
            - type: object
              additionalProperties: false
              required: [status, stage, turnId]
              properties:
                status: { enum: [QUEUED, RUNNING, NEEDS_INPUT, COMPLETED, FAILED, CANCELLED] }
                stage: { type: string }
                turnId: { type: [string, 'null'] }
                durationMs: { type: integer, minimum: 0 }
          description: >-
            WorkerPublicPayload with backend-assigned answerRevision on starts or resultRevision
            on results.ready. request.state contains status, stage, nullable turnId, and durationMs
            only when a known final running duration exists. No internal plan, reasoning or raw error.
    PublicEventPage:
      type: object
      required: [events, lastEventSeq, status, requestRevision, workspaceEpoch, conversationEpoch, hasMore]
      properties:
        events: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/PublicEvent' } }
        lastEventSeq: { type: integer }
        status: { enum: [QUEUED, RUNNING, NEEDS_INPUT, COMPLETED, FAILED, CANCELLED] }
        requestRevision: { type: integer }
        workspaceEpoch: { type: integer }
        conversationEpoch: { type: integer }
        hasMore: { type: boolean }
    PublicActivityRecord:
      type: object
      additionalProperties: false
      required: [activityId, code, phase, seq, occurredAt]
      properties:
        activityId: { $ref: '#/components/schemas/PublicActivity/properties/activityId' }
        code: { $ref: '#/components/schemas/PublicActivity/properties/code' }
        phase: { $ref: '#/components/schemas/PublicActivity/properties/phase' }
        stepId: { $ref: '#/components/schemas/PublicActivity/properties/stepId' }
        runCount: { $ref: '#/components/schemas/PublicActivity/properties/runCount' }
        metricIds: { $ref: '#/components/schemas/PublicActivity/properties/metricIds' }
        seq: { type: integer }
        occurredAt: { type: string, format: date-time }
    ProgressSnapshot:
      type: object
      required: [lastEventSeq, activities, answer, resultRevision]
      properties:
        lastEventSeq: { type: integer }
        activities:
          type: array
          items: { $ref: '#/components/schemas/PublicActivityRecord' }
        answer:
          type: [object, 'null']
          required: [streamId, answerRevision, mode, status, blocks]
          properties:
            streamId: { type: string }
            answerRevision: { type: integer }
            mode: { enum: [general, interpretation] }
            status: { enum: [writing, reviewing, rewriting, interrupted, done] }
            blocks:
              type: array
              items:
                type: object
                required: [id, text]
                properties:
                  id: { type: string }
                  text: { type: string }
        resultRevision: { type: [integer, 'null'] }
    ExecutionSummary:
      type: object
      additionalProperties: false
      required: [durationMs, activities]
      properties:
        durationMs: { type: integer, minimum: 0, description: Fixed cumulative RUNNING milliseconds; no queue/HITL time. }
        activities: { type: array, items: { $ref: '#/components/schemas/PublicActivityRecord' } }
    LegacyV2RunOptions:
      type: object
      description: Frozen candidates of a graph-v2 selection, without format=2.
      required: [requestId, requestRevision, pendingInputId, options]
      properties:
        requestId: { type: string, format: uuid }
        requestRevision: { type: integer }
        pendingInputId: { type: string }
        searchCriteria:
          type: object
          required: [constraints, goals]
          properties:
            constraints: { type: array, items: { type: object } }
            goals: { type: array, items: { type: object } }
        options:
          type: array
          items:
            type: object
            required: [key, ref, conditions, selectable, unavailableReason]
            properties:
              key: { type: string }
              ref: { $ref: '#/components/schemas/RunRef' }
              conditions:
                type: object
                additionalProperties: { $ref: './agent-answer-v2.schemas.yaml#/components/schemas/ScalarDatum' }
              searchMeasurements:
                type: object
                description: Filter and sort measurements from the saved search for this exact Run version.
                additionalProperties: { $ref: './agent-answer-v2.schemas.yaml#/components/schemas/ScalarDatum' }
              selectable: { type: boolean }
              unavailableReason: { type: [string, 'null'] }
    RunSelectionPage:
      type: object
      required: [format, requestId, requestRevision, pendingInputId, snapshotId, selectionRevision, totalCount, baselineKey, options, hasMore, nextCursor]
      properties:
        format: { const: 2 }
        requestId: { type: string, format: uuid }
        requestRevision: { type: integer }
        pendingInputId: { type: string }
        snapshotId: { type: string, format: uuid }
        selectionRevision: { type: integer }
        totalCount:
          type: [integer, 'null']
          description: Null on page/selection reads; use the independent count endpoint for current catalogue totals.
        baselineKey: { type: [string, 'null'] }
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'] }
        options:
          type: array
          maxItems: 100
          items:
            type: object
            required: [key, ref, conditions, selectable, unavailableReason, selected]
            properties:
              key: { type: string }
              ref: { $ref: '#/components/schemas/RunRef' }
              conditions:
                type: object
                required: [pressure, sourcePower, biasPower]
                additionalProperties: { $ref: './agent-answer-v2.schemas.yaml#/components/schemas/ScalarDatum' }
              selectable: { type: boolean }
              selected: { type: boolean }
              unavailableReason: { type: [string, 'null'] }
    RunSelectionState:
      allOf:
        - { $ref: '#/components/schemas/RunSelectionPage' }
        - type: object
          required: [selectedCount, unavailableCount]
          properties:
            selectedCount: { type: integer }
            unavailableCount: { type: integer }
    OutputResponse:
      type: object
      additionalProperties: false
      required: [outputs]
      properties:
        outputs:
          type: array
          maxItems: 350
          items:
            type: object
            additionalProperties: false
            required: [metadata, features, display]
            properties:
              metadata: { $ref: './agent-answer-v3.schemas.yaml#/$defs/OutputMetadata' }
              features:
                type: object
                additionalProperties: { $ref: './agent-answer-v2.schemas.yaml#/components/schemas/ScalarDatum' }
              display:
                anyOf:
                  - type: 'null'
                  - type: object
                    additionalProperties: false
                    required: [kind, samples, rows]
                    properties:
                      kind: { enum: [line, grid] }
                      samples:
                        type: array
                        maxItems: 164
                        items:
                          type: object
                          additionalProperties: false
                          required: [x, y]
                          properties:
                            x: { type: number }
                            y: { type: number }
                      rows:
                        type: array
                        maxItems: 41
                        items:
                          type: object
                          additionalProperties: false
                          required: [x, coordinates, values]
                          properties:
                            x: { type: number }
                            coordinates: { type: array, maxItems: 61, items: { type: number } }
                            values: { type: array, maxItems: 61, items: { type: number } }
    OutputQuery:
      type: object
      required: [runRefs, plotIds]
      properties:
        runRefs: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { $ref: '#/components/schemas/RunRef' } }
        plotIds: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { enum: [ied, iad, iead, current, potential, density, residual] } }
    RunRef:
      type: object
      required: [runId, runVersionId]
      properties:
        runId: { type: string }
        runVersionId: { type: string, format: uuid }
    StateToken:
      type: object
      required: [workspaceEpoch, conversationEpoch, revision]
      properties:
        workspaceEpoch: { type: integer }
        conversationEpoch: { type: integer }
        revision: { type: integer }
    ReverseQuery:
      type: object
      additionalProperties: false
      required: [constraints, goals]
      description: At least one constraint or goal. Inputs have already been validated and normalized by Python; the backend independently validates its SQL whitelist. No SQL text is accepted.
      properties:
        constraints:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [metric, operator, unit]
            properties:
              metric: { enum: [pressure, sourcePower, biasPower, meanIonEnergy, ionFlux, iedWidth] }
              operator: { enum: [eq, lt, lte, gt, gte, between] }
              unit: { type: string, description: Canonical registry unit for the metric. }
              value: { type: number }
              min: { type: number }
              max: { type: number }
        goals:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [metric, direction, unit]
            properties:
              metric: { enum: [meanIonEnergy, ionFlux, iedWidth] }
              direction: { enum: [maximize, minimize, target_range] }
              unit: { type: string, description: Canonical registry unit for the metric. }
              min: { type: number }
              max: { type: number }
    Submission:
      type: object
      required: [text, stateToken]
      description: Graph identity is pinned by the first request in a conversation. V3 switches are pinned separately for each request, including follow-ups in an already-v3 conversation. They cannot change a pending request.
      properties:
        text: { type: string, minLength: 1, maxLength: 16000 }
        stateToken: { $ref: '#/components/schemas/StateToken' }
        graphVersion: { enum: [v1, v2, v3], description: Omit to retain the conversation version, or v1 for an unpinned conversation. }
        v3Options: { $ref: '#/components/schemas/V3OptionsInput' }
        baseline: { $ref: '#/components/schemas/RunRef' }
        selectedRunRef: { $ref: '#/components/schemas/RunRef' }
        attachedRunRefs: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/RunRef' }, description: Explicit UI tags or selected group only; exact versions. }
        referenceOrigins:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ref, kind, turnId, groupId]
            properties:
              ref: { $ref: '#/components/schemas/RunRef' }
              kind: { enum: [run_tag, candidate_group, catalog_tag] }
              turnId: { type: [string, 'null'], description: Null for a saved catalog tag }
              groupId: { type: [string, 'null'] }
              executionId: { type: string }
              stepId: { type: string }
        candidateReferences: { type: array, items: { $ref: '#/components/schemas/RunRef' } }
      allOf:
        - if: { required: [graphVersion], properties: { graphVersion: { const: v3 } } }
          then: { required: [v3Options] }
        - if: { required: [graphVersion], properties: { graphVersion: { enum: [v1, v2] } } }
          then: { not: { required: [v3Options] } }
    V3OptionsInput:
      type: object
      additionalProperties: false
      required: [rulesEnabled, ragEnabled]
      properties:
        rulesEnabled: { type: boolean, description: Enables the explicit cost-regex-2 decision-record exclusion action for new V3 execution; historical cost-regex-1 answers remain readable. Does not disable mandatory numerical validation. }
        ragEnabled: { type: boolean, description: Enables local semantic retrieval of saved decision evidence. }
    V3OptionsSnapshot:
      type: object
      additionalProperties: false
      required: [rulesEnabled, ragEnabled, configDigest]
      properties:
        rulesEnabled: { type: boolean }
        ragEnabled: { type: boolean }
        configDigest: { type: string, pattern: '^[0-9a-f]{64}$', readOnly: true, description: SHA256 of UTF8 compact sorted-key JSON containing the two booleans only. }
    RequestView:
      type: object
      required: [requestId, requestRevision, status, stage, graphVersion, inputEvents]
      properties:
        requestId: { type: string, format: uuid }
        requestRevision: { type: integer }
        workspaceEpoch: { type: integer, description: Additive request scope for event fencing. }
        conversationEpoch: { type: integer, description: Original room; independent of currently active room. }
        progress: { $ref: '#/components/schemas/ProgressSnapshot' }
        executionSummary: { $ref: '#/components/schemas/ExecutionSummary' }
        status: { enum: [QUEUED, RUNNING, NEEDS_INPUT, COMPLETED, FAILED, CANCELLED] }
        stage: { type: string }
        graphVersion: { enum: [v1, v2, v3] }
        v3Options: { $ref: '#/components/schemas/V3OptionsSnapshot' }
        question: { type: [string, 'null'] }
        pendingInput:
          type: [object, 'null']
          description: 'At least id and message; optional fields/options. Omitted numeric units use fixed defaults saved as answerSnapshot.unitAssumptions. Unknown/incompatible explicit units still require clarification; unitMetric binds a unit-only correction to its slot. Pure high/low sorting needs no unit.'
          properties:
            minSelections: { type: integer, minimum: 2, description: 'Minimum Run selection count; defaults to 2.' }
            maxSelections: { type: integer, minimum: 2, description: 'Optional Run selection limit. Equals minSelections for an exact count.' }
        error: { type: [object, 'null'] }
        partialResult:
          type: [object, 'null']
          description: Failed compare_runs retains every field of ComparisonResultV2 or extended ComparisonResultV3 plus schemaVersion=2/3 and explanationComplete=false; no answerSnapshot, LLM draft or new turn.
        turnId: { type: [string, 'null'] }
        answerSnapshot:
          oneOf:
            - { $ref: './agent-answer-v2.schemas.yaml#/components/schemas/AnswerSnapshotV2' }
            - { $ref: './agent-answer-v3.schemas.yaml' }
            - { $ref: './agent-v2.answer.schema.json' }
            - { $ref: './agent-graph-v3.answer.schema.json' }
            - { type: object, properties: { schemaVersion: { const: 1 } }, description: Immutable historical schema-1 snapshot. }
            - { type: 'null' }
        intent: { type: [string, 'null'] }
        usedRunRefs: { type: array, items: { $ref: '#/components/schemas/RunRef' } }
        inputEvents: { type: array, items: { type: object, description: id, requestRevision, input, createdAt } }
        createdAt: { type: string, format: date-time }
    Mutation:
      type: object
      required: [claimGeneration, requestRevision]
      properties:
        claimGeneration: { type: integer }
        requestRevision: { type: integer }
        leaseSeconds: { type: integer, minimum: 5, maximum: 300 }
        stage: { type: string }
        operationKind: { enum: [forward_lookup, reverse_search, compare_runs, generate_answer, decision_records, explain_change, explain_concept, unsupported] }
        dependsOnContext: { type: boolean }
        payload: { type: object, description: Opaque bounded checkpoint envelope. }
        pendingInput: { type: object, required: [id, message] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, pattern: '^[A-Z0-9_]{1,80}$' }
            message: { type: string, minLength: 1, maxLength: 1000 }
        partialResult: { type: object }
        usedRunRefs: { type: array, items: { $ref: '#/components/schemas/RunRef' } }
        requiredRunRefs: { type: array, items: { $ref: '#/components/schemas/RunRef' } }
        referencesOnly: { type: boolean, default: false }
        reverseQuery: { $ref: '#/components/schemas/ReverseQuery' }
        forwardQuery:
          type: object
          additionalProperties: false
          required: [pressure, sourcePower, biasPower]
          properties:
            pressure: { type: number, description: Canonical mTorr }
            sourcePower: { type: number, description: Canonical W }
            biasPower: { type: number, description: Canonical W including zero }
        answer: { type: object, description: AgentResponse with an exact matching v1/v2/v3 answerSnapshot. Graph-v3 executionMode must equal the request v3Options and decisionEvidence must equal the saved decision step snapshots. }
        limit: { type: integer, minimum: 1, maximum: 4 }

# Reverse scoped-context contract (search result schema is defined in agent-answer-v2.schemas.yaml):
# reverseQuery selects current rows and their versions in one SQL snapshot, then freezes
# only selectedRunRefs/runs. referencesOnly freezes requiredRunRefs, not the catalog.
# catalogMaterialized=true also represents an empty selection; retries never refresh it.
# New reverse answers use result.searchResultVersion=2, runsByVersion/commonRunRefs and
# objectiveResults[].candidateRefs. No near candidates or global catalogRunRefs are emitted.
