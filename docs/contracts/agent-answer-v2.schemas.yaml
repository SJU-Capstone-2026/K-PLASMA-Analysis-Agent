      type: object
    ReverseInputs:
      additionalProperties: false
      properties:
        constraints:
          items:
            $ref: '#/components/schemas/Constraint'
          title: Constraints
          type: array
        goals:
          items:
            $ref: '#/components/schemas/Goal'
          title: Goals
          type: array
        context_rules:
          items:
            enum:
            - energy_slightly_higher
            - flux_maintained_and_width_lower
            type: string
          title: Context Rules
          type: array
      title: ReverseInputs
      type: object
    CompareToolInputs:
      additionalProperties: false
      properties:
        ref_keys:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Ref Keys
        metrics:
          anyOf:
          - items:
              enum:
