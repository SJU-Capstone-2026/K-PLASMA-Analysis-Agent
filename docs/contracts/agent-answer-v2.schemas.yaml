              - ionFlux
              - iedWidth
              type: string
            type: array
          - type: 'null'
          default: null
          title: Metrics
        analysis:
          anyOf:
          - enum:
            - auto
            - values
            - differences
            - trend
            - interpretation
            type: string
          - type: 'null'
          default: null
          title: Analysis
        baseline_key:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Baseline Key
        trend_axis:
          anyOf:
          - enum:
            - pressure
            - sourcePower
            - biasPower
            type: string
          - type: 'null'
          default: null
          title: Trend Axis
      title: CompareToolInputs
      type: object
    GeneralInputs:
      additionalProperties: false
      properties: {}
      title: GeneralInputs
      type: object
