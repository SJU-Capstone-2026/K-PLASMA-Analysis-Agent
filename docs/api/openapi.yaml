    ReviewRecord:
      type: object
      additionalProperties: false
      required:
      - reviewId
      - targetRunId
      - comparedRunIds
      - targetRunRef
      - comparedRunRefs
      - decision
      - comment
      - authorName
      - createdAt
      - analysisType
      - processMode
      - goals
      - queryText
      - constraints
      - evidenceKinds
      - limitations
      - runSnapshots
      properties:
        reviewId: *id001
        targetRunId: *id001
        comparedRunIds: &id012
          type: array
          items: *id001
        targetRunRef: &id013
          $ref: '#/components/schemas/RunRef'
        comparedRunRefs: &id014
          type: array
          items:
            $ref: '#/components/schemas/RunRef'
        decision:
          $ref: '#/components/schemas/Decision'
        comment: *id001
        authorName: *id001
        createdAt: *id011
        analysisType:
          type: string
          enum:
          - FORWARD
          - REVERSE
          - EXPLANATION
        processMode: *id001
        goals: &id015
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
        queryText: *id001
        constraints:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
        evidenceKinds:
          type: array
          items: *id001
        limitations:
          type: array
          items: *id001
        runSnapshots:
          type: array
          items:
            $ref: '#/components/schemas/RunSnapshot'
      description: REV has no version property. Explanation reviews retain one baseline
        comparison. Scalar snapshots preserve historical values; all referenced versions
        are immutable.
    ExperimentRecord:
      type: object
      additionalProperties: false
      required:
      - reviewId
      - targetRunId
      - comparedRunIds
      - targetRunRef
      - comparedRunRefs
      - decision
      - comment
      - authorName
      - createdAt
      - analysisType
      - processMode
      - goals
      - queryText
      - id
      - version
      - question
      - objectives
      - overallComment
      - candidates
      properties:
        reviewId: *id001
        targetRunId: *id001
        comparedRunIds: *id012
        targetRunRef: *id013
        comparedRunRefs: *id014
        decision:
          $ref: '#/components/schemas/ExperimentDecision'
        comment: *id001
        authorName: *id001
        createdAt: *id011
        analysisType:
          type: string
          const: REVERSE
        processMode:
          type: string
          const: GOAL_RECOMMENDATION
        goals: *id015
        queryText: *id001
        id: *id001
        version:
          type: integer
          const: 2
        question: *id001
        objectives:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
        overallComment: *id001
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CandidateSnapshot'
          minItems: 1
          maxItems: 3
      description: EXP version 2. A normal new write requires exactly one ADOPT plus
        up to two HOLD/REJECT candidates, unique known RunRefs. ALTERNATIVE/COMPARISON
        survive historical reads, not ordinary SINGLE_ADOPT writes. targetRunId and
        comparedRunIds must match the corresponding refs.
    DecisionRecord:
      oneOf:
      - $ref: '#/components/schemas/ReviewRecord'
      - $ref: '#/components/schemas/ExperimentRecord'
