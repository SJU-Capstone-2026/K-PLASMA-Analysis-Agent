name: kplasma-selection-benchmark
services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: kplasma-selection-benchmark-db
    labels:
      kplasma.benchmark: run-selection-synthetic-only
    environment:
      POSTGRES_DB: run_selection_bench
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark-local-only
    ports: ['127.0.0.1:15449:5432']
    cpus: 2
    mem_limit: 6g
    shm_size: 256m
    command: ['postgres', '-c', 'shared_buffers=256MB', '-c', 'work_mem=16MB', '-c', 'max_parallel_workers_per_gather=0', '-c', 'shared_preload_libraries=pg_stat_statements']
    volumes: ['benchmark-data:/var/lib/postgresql']
volumes:
  benchmark-data:
