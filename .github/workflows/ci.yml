name: Synthetic verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version-file: agent/python/.python-version
      - run: python -m pip install uv==0.12.23
      - run: uv sync --project agent/python --frozen
      - run: uv run --project agent/python --frozen pytest agent/python/tests agent/python/evals
      - run: uv run --project agent/python --frozen ruff check agent/python/src agent/python/tests agent/python/evals
      - run: uv run --project agent/python --frozen mypy agent/python/src
      - run: npm ci
      - run: npm run verify:public-files
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: backend/gradlew -p backend test --console=plain
      - run: npm exec --workspace frontend -- playwright install --with-deps chromium
      - run: npm exec --workspace frontend -- playwright test --config src/features/agent/agent-v1.playwright.config.ts --grep 'v1 five cards'
      - run: npm run test:e2e
      - run: npm run test:agent:restart
      # Deliberately no upload-artifact step. External sources, traces, payloads and screenshots stay local.
